name: Dependabot auto-merge

# Auto-approves and enables auto-merge for non-major Dependabot updates.
#
# Runs as `pull_request_target` so it executes in the base-repo context with
# Actions secrets and write permissions available. A Dependabot `pull_request`
# run instead gets a read-only token and only Dependabot secrets, which is why
# this must be pull_request_target. We never check out the PR head, so untrusted
# code is never executed; the job is gated to the dependabot[bot] actor.
#
# Requires Actions secret DEPENDABOT_AUTOMERGE_TOKEN: a PAT belonging to a
# CODEOWNER, so its review satisfies require_code_owner_reviews. Re-approving on
# every push also clears the stale-review dismissal a Dependabot rebase causes.
# Without the secret the approve step no-ops and auto-merge waits for a manual
# approval. Branch protection still gates the merge on the required CI checks.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge Dependabot PRs
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Approve as code owner (non-major)
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        continue-on-error: true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: gh pr review --approve "$PR_URL"
      - name: Enable auto-merge (non-major)
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
