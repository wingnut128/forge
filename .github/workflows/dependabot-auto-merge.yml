name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # HAS_PAT lets the approve/merge steps no-op until DEPENDABOT_PAT is set,
    # so the workflow doesn't fail on Dependabot PRs before the secret exists.
    env:
      HAS_PAT: ${{ secrets.DEPENDABOT_PAT != '' }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      # Patch and minor only; major bumps stay manual. The approval uses a
      # fine-grained PAT acting as the code owner (CODEOWNERS), which satisfies
      # the require_code_owner_reviews gate that GITHUB_TOKEN cannot. Branch
      # protection still gates the actual merge on the required CI checks, so a
      # failing bump never lands.
      - name: Approve as code owner
        if: >-
          env.HAS_PAT == 'true' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
      - name: Enable auto-merge
        if: >-
          env.HAS_PAT == 'true' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_PAT }}
